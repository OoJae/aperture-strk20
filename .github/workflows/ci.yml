name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Cairo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the versions the contracts were developed against.
      # Keep in sync with contracts/Scarb.toml.
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.20.0"
          # The Cairo package lives in contracts/, not at the repo root.
          scarb-lock: contracts/Scarb.lock

      - uses: foundry-rs/setup-snfoundry@v6
        with:
          starknet-foundry-version: "0.63.0"

      - name: Build
        working-directory: contracts
        run: scarb build

      - name: Test
        working-directory: contracts
        run: snforge test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    # The Privacy SDK is served from GitHub Packages, which requires a token
    # even for public packages.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Written to the runner's home rather than the repo, so the committed
      # .npmrc stays free of anything token-shaped.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The deployed artifact was never compiled in CI, so a build-breaking
      # change to apps/web passed green and only failed on Vercel.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Generated files are generated. If either would change, the tree is
      # carrying a hand-edit that will drift.
      - name: Generated files are in sync
        run: |
          node scripts/sync-manifest.ts --check
          node scripts/sync-counts.ts --check
          git diff --exit-code

  tokenless-clone:
    name: Clean clone, no token
    runs-on: ubuntu-latest
    # The README tells a stranger they can work on the contracts, the shared
    # package and the web app without a GitHub Packages token. This job is what
    # makes that a checked claim rather than a hopeful one.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install without the tally workspace
        run: pnpm install --frozen-lockfile --filter '!@aperture/tally'

      - name: Shared package
        run: |
          pnpm --filter @aperture/strk20-governance typecheck
          pnpm --filter @aperture/strk20-governance test

      - name: Web app builds
        run: pnpm --filter @aperture/web build

      - name: Repo invariants
        run: node --test scripts/tests/*.test.ts
