[package]
name = "aperture"
version = "0.2.0"
edition = "2024_07"

# Toolchain pins (keep in sync with .github/workflows/ci.yml):
#   Scarb 2.20.0 · Cairo 2.20.0 · Starknet Foundry 0.63.0
[dependencies]
starknet = "2.20.0"
# The treasury multisig wraps this rather than hand-rolling threshold logic for
# a contract that guards funds. Requires starknet ^2.13.1; we pin 2.20.0.
openzeppelin_governance = "3.0.0"
# The IMultisig dispatcher lives here. Declared directly rather than relied on
# transitively, so a future minor bump of the governance package cannot silently
# take the interface with it.
openzeppelin_interfaces = "2.1.0"

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.20.0"

[[target.starknet-contract]]
sierra = true
# sncast declare needs the compiled class to compute a CASM hash.
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
# Pinned so a fuzz failure in CI reproduces locally.
fuzzer_seed = 1234
